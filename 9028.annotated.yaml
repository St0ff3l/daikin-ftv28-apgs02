# Annotated copy of SmartIR device code 9028. SmartIR loads `9028.json`, not this YAML file.
# All IR payloads are copied unchanged. State fields are decoded from Broadlink pulses as Daikin64.
# Byte indices start at 0; bits are transmitted least-significant bit first.
# Byte 0: fixed identifier. Byte 1: high nibble = fan, low nibble = mode (2 = cool).
# Byte 2: clock minutes (BCD). Byte 3: clock hours (BCD). Byte 6: target temperature (BCD).
# Bytes 4-5: on/off timers; low 6 bits = BCD hour, bit 6 = half hour, bit 7 = timer enabled.
# Byte 7: bit 0 = vertical swing, bit 1 = sleep, bit 2 = reserved, bit 3 = power toggle, bits 4-7 = checksum.
# Checksum: sum the first 15 nibbles and keep the low 4 bits. All 61 payloads pass this check.
# The `off` entry is a power-toggle frame with saved settings, not an absolute off command.
# Cool frames have the power-toggle bit cleared; this does not guarantee that a powered-off unit will turn on.
# The clock is the time encoded by the remote when the code was learned, not Home Assistant time.
# Decoding is not a hardware test. No IR commands were transmitted for verification.
# Protocol: https://github.com/crankyoldgit/IRremoteESP8266/blob/master/src/ir_Daikin.h
# Checksum and BCD implementation: https://github.com/crankyoldgit/IRremoteESP8266/blob/master/src/ir_Daikin.cpp

